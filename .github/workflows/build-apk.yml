name: Gerar APK Km Justo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          mkdir projeto
          unzip -q KmJusto-v2.0-cloud.zip -d projeto
          chmod +x $(find projeto -name gradlew -type f | head -1)

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        run: |
          ROOT=$(dirname "$(find projeto -name gradlew -type f | head -1)")
          cd "$ROOT"
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: KmJusto-apk
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
