name: Gerar APK Km Justo

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Extrair projeto
        run: |
          rm -rf projeto
          mkdir projeto
          unzip -q KmJusto-v2.0-cloud.zip -d projeto

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compilar APK
        run: |
          ROOT=$(dirname "$(find projeto -name settings.gradle -type f -print -quit)")
          echo "Projeto encontrado em: $ROOT"
          cd "$ROOT"
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: KmJusto-apk
          path: projeto/**/app/build/outputs/apk/debug/app-debug.apk
